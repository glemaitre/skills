[workspace]
name = "probabl-skills"
version = "0.7.0"
description = "Skills for ML experimentation in Python, organized around skrub, scikit-learn, and skore."
authors = ["Probabl <contact@probabl.ai>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
# The maintenance scripts in tools/ only need the standard library;
# pin a recent Python so behaviour is consistent across contributors
# and CI.
python = ">=3.11,<3.14"

[tasks]
hash = { cmd = "python tools/hash_skills.py", description = "Refresh per-skill and aggregate SHA-256 hashes in .catalog.json." }
hash-check = { cmd = "python tools/hash_skills.py --check", description = "Verify .catalog.json hashes match the on-disk skills (non-zero exit on drift)." }
evals-check = { cmd = "python eval/convert_to_evals_json.py --check", description = "Verify skills/*/evals/evals.json match eval/*/prompts.md (non-zero exit on drift)." }
validate = { cmd = "python tools/validate_catalog.py", description = "Validate .catalog.json structure: skill/folder symmetry, categories, workflow references." }
check-versions = { cmd = "python tools/check_versions.py", description = "Verify the version matches across .catalog.json, pixi.toml, and the Claude/Cursor plugin manifests." }
bump-major = { cmd = "python tools/bump_version.py major", description = "Bump the major version across all version sources." }
bump-minor = { cmd = "python tools/bump_version.py minor", description = "Bump the minor version across all version sources." }
bump-patch = { cmd = "python tools/bump_version.py patch", description = "Bump the patch version across all version sources." }
check = { depends-on = ["hash-check", "evals-check", "validate", "check-versions"], description = "Run every CI check: hash verification + evals.json drift + catalog structure validation + version consistency." }

# Optional LLM evals (DeepEval). Not part of `pixi run check` / catalog CI.
[feature.eval.pypi-dependencies]
deepeval = "*"
litellm = "*"
pytest = ">=8"
pytest-xdist = "*"
python-dotenv = ">=1.0"

# Model ids for the evals. Secrets never go here — keys live in `.env`
# (see `.env.example`). Names are LiteLLM ids; `openrouter/<vendor>/<model>`
# routes through OpenRouter and needs only `OPENROUTER_API_KEY`.
#
# SKILL_EVAL_MODELS       comma-separated target models (models under test,
#                         one pytest node per model x case x mode)
# SKILL_EVAL_JUDGE_MODEL  single judge model for DeepEval GEval. Same class
#                         of model as the targets — cheap, and good enough
#                         for these rubrics. Self-grades when DeepSeek is
#                         also a target; override with --skill-judge-model
#                         for an independent read.
# SKILL_EVAL_MODE         with     SKILL.md as the system prompt
#                         without  empty system prompt (baseline)
#                         both     run each case twice and report the
#                                  pass-rate delta in the pytest summary
# SKILL_EVAL_PASS_RATIO   Must-do GEval threshold in [0, 1] (partial
#                         credit). Must-NOT stays all-or-nothing.
#
# Overridable per run with `--skill-model` (repeatable),
# `--skill-judge-model`, `--skill-mode`, and `--skill-pass-ratio`.
[feature.eval.activation.env]
# Small, cheap models: the skills must stay legible to these.
# Full sweep: "openrouter/deepseek/deepseek-v4.1-flash,openrouter/z-ai/glm-5.3-flash,openrouter/qwen/qwen3.8-27b"
SKILL_EVAL_MODELS = "openrouter/deepseek/deepseek-v4.1-flash"
SKILL_EVAL_JUDGE_MODEL = "openrouter/deepseek/deepseek-v4.1-flash"
SKILL_EVAL_MODE = "with"
SKILL_EVAL_PASS_RATIO = "0.7"

[feature.eval.tasks]
eval = { cmd = "pytest tests/eval -m eval -n auto", description = "Run DeepEval skill evaluations (requires provider API keys)." }

[environments]
eval = { features = ["eval"] }
